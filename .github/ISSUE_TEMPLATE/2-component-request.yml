name: Component request
description: Ask for a component that Commmerce UI does not have yet.
title: "[component] "
labels: [triage, component-request]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Don't include customer data, personal data, API keys or private screenshots.
        For private matters email support@commmerce.com.
  - type: input
    id: product
    attributes:
      label: Product or app
      description: Which product or app is this for? (for example Commmerce Connect, Commmerce CRM, or your app's name)
      placeholder: Commmerce CRM
    validations:
      required: true
  - type: dropdown
    id: team
    attributes:
      label: Internal or third-party
      options:
        - Commmerce team (internal)
        - Third-party developer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commmerce UI version
      description: From package.json, or the /v/<version>/ part of the CDN link.
      placeholder: 1.20.2
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component name
      placeholder: Kanban card
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What do you need it for?
      description: The task your users are doing, and why the existing components don't cover it.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: A public page that shows the problem, if there is one. Demo data only, never real customer data.
      placeholder: https://
  - type: input
    id: device
    attributes:
      label: Screen width or device
      description: Browser window width and device, or "all".
      placeholder: 390px, iPhone 16, Safari
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide any real customer or personal data first.
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: How you expect it to look and behave.
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What you have today without it.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What you are building instead for now.
