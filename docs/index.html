<title>Commmerce UI</title>
<meta name="description" content="The design system for building on Commmerce: tokens, components, icons and guidelines." />
<link rel="icon" href="https://cdn.commmerce.com/commmerce/website/assets/images/compressed/commmerce-favicon.png" />
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="vendor/tokens.css" />
<link rel="stylesheet" href="docs.css" />
<script>
  // Theme: the viewer's explicit choice on this site wins, then the host's data-theme, then the OS.
  (function () {
    var root = document.documentElement, saved = null;
    try { saved = localStorage.getItem('cm-docs-theme'); } catch (e) {}
    root.dataset.cmTheme = saved || root.getAttribute('data-theme') || 'auto';
    // The site and its examples use the refined look, the one Commmerce products use (20 Nov 2026).
    root.dataset.cmLook = 'refined';
  })();
</script>
<script type="module" src="vendor/cdn.js"></script>
<script type="module" src="app.js"></script>

<a class="skip" href="#main">Skip to content</a>
<!-- The site uses the Commmerce frame itself (1.19): header bar, side navigation, page panel; bottom navigation and mobile menu on phones. -->
<cm-app-frame id="docs-frame" panel menu-item="more">
  <cm-header-bar slot="header" search-label="Search the docs">
    <a slot="logo" class="brand" href="#" aria-label="Commmerce UI home">
      <img class="logo logo--light" src="https://commmerce.com/assets/svg/commmerce-wordmark-tm-black.svg?v=3" alt="" width="165" height="12" />
      <img class="logo logo--dark" src="https://commmerce.com/assets/svg/commmerce-wordmark-tm-white.svg?v=3" alt="" width="165" height="12" />
      <span class="brand-ui">UI</span>
    </a>
    <cm-global-search slot="search" id="q" label="Search the docs" placeholder="Search components, tokens, icons" shortcut="/"
      empty-text="Nothing found. Try a component name, a tag such as cm-button, a token or an icon."></cm-global-search>
    <cm-button slot="end" id="theme" variant="tertiary" icon-only icon="moon" label="Switch to dark theme"></cm-button>
  </cm-header-bar>
  <cm-side-navigation slot="navigation" id="sidenav" label="Docs" collapsible></cm-side-navigation>
  <div id="main" tabindex="-1"></div>
  <cm-bottom-navigation slot="bottom-navigation" id="bottomnav" label="Docs sections"></cm-bottom-navigation>
  <cm-mobile-menu slot="mobile-menu" id="mobilemenu" label="All docs"></cm-mobile-menu>
</cm-app-frame>
